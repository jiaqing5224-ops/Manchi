<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#14141F"/>
    </linearGradient>
    <linearGradient id="hx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Hexagon -->
  <polygon points="128,36 200,78 200,178 128,220 56,178 56,78" stroke="url(#hx)" stroke-width="4" fill="none" stroke-linejoin="round" filter="url(#gl)"/>
  <!-- Inner hex -->
  <polygon points="128,72 178,98 178,158 128,184 78,158 78,98" fill="url(#hx)" opacity="0.08"/>
  <!-- Center node -->
  <circle cx="128" cy="128" r="8" fill="#4FC3F7" opacity="0.7"/>
  <!-- Radial lines -->
  <line x1="128" y1="60" x2="128" y2="90" stroke="#4FC3F7" stroke-width="2" opacity="0.3"/>
  <line x1="128" y1="166" x2="128" y2="196" stroke="#7C3AED" stroke-width="2" opacity="0.3"/>
  <line x1="68" y1="100" x2="92" y2="116" stroke="#4FC3F7" stroke-width="2" opacity="0.2"/>
  <line x1="164" y1="140" x2="188" y2="156" stroke="#7C3AED" stroke-width="2" opacity="0.2"/>
</svg>
